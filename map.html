<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#121829">
<meta name="robots" content="noindex">
<title>Tapestry: a map of memories</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="legal.css">
<style>
  /* a shared map: as the Places screen draws it (tapestry.css, .MemoryMap) */
  main { max-width: 56rem; }
  .MemoryMap { height: 70vh; min-height: 320px; border-radius: 12px; overflow: hidden; background: #1b2339; z-index: 0; }
  .MemoryMap .MemoryDot span { display: block; width: 100%; height: 100%; border-radius: 50%; border: 2px solid #121829; box-sizing: border-box; box-shadow: 0 0 0 1px rgb(255 255 255 / 0.5); }
  .MemoryMap .MemoryPopup { display: flex; flex-direction: column; gap: 8px; }
  .MemoryMap .MemoryDotLink { color: #121829; display: flex; align-items: center; gap: 8px; }
  .MemoryMap .MemoryDotLink i { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
  .DateKey { display: flex; align-items: center; gap: 10px; margin: 10px 0 0; color: #8e9ab8; }
  .DateRamp { flex: 1; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #4b2a8c, #3b5bdb, #1c9fc9, #19c3b3, #7bd389, #f2c14e); }
  .from { color: #8e9ab8; font-size: 0.9rem; margin-top: 24px; }
</style>
</head>
<body>
<main>
<h1 id="whose">A map of memories</h1>
<p class="when" id="said">Loading…</p>
<div id="shown" hidden>
  <div id="memory-map" class="MemoryMap"></div>
  <div class="DateKey"><span id="from"></span><span class="DateRamp"></span><span id="to"></span></div>
</div>
<p class="from">Shared from Tapestry.</p>
</main>
<script type="module" src="sharedmap.js"></script>
</body>
</html>
